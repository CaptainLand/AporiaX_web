name: web-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Preview smoke
        run: |
          npm run preview -- --port 4173 > /tmp/aporia-web.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://localhost:4173/ > /tmp/home.html
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://localhost:4173/account > /tmp/account.html
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS 'http://localhost:4173/authorize/desktop?client_id=aporiax-desktop&redirect_uri=http%3A%2F%2F127.0.0.1%3A49152%2Fcallback&code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&code_challenge_method=S256&state=desktop-auth-smoke-state&device_name=CI%20Desktop&platform=win32' > /tmp/desktop-auth.html
          grep -q '<div id="root"></div>' /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/account.html
          grep -q '<div id="root"></div>' /tmp/desktop-auth.html

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/aporia-web.log 2>/dev/null || true
